<style id="css">
/* VOICE: premium remodeling crew, warm and trustworthy, bilingual.
   IDEA: a job-site binder: estimate sheet, materials list, punch list.
   PICTURE: the Sonec badge and a big copper progress ring on the client hero.
   COLOUR and TYPE: brand black, copper, brushed silver; Barlow + Montserrat.
   LAYOUT: sticky header, hero, section tabs, one calm column of cards. */
:root{color-scheme:light dark;--bg:light-dark(#f3f1ee,#0d0d0f);--card:light-dark(#ffffff,#18181b);--ink:light-dark(#17171a,#ecebe8);--mute:light-dark(#62605c,#a4a29d);--line:light-dark(#e2ded8,#2a2a2e);--cu:#c9682e;--cu2:light-dark(#a8501d,#ec9259);--ok:light-dark(#2f7d4f,#62c48a);--soft:light-dark(#f8efe8,#231a15)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Barlow Semi Condensed",Barlow,sans-serif;line-height:1.08;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cu);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 max(4vw,14px)}
header.top{position:sticky;top:0;z-index:20;background:#0d0d0f;color:#ecebe8;border-bottom:2px solid var(--cu)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.brand svg{width:42px;height:42px}
.brand b{font:700 17px Montserrat,sans-serif;letter-spacing:.06em}
.brand small{display:block;font-size:12px;color:#a4a29d;letter-spacing:.02em}
.seg{display:flex;border:1px solid #3a3a3f;border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:8px 14px;min-height:40px;color:#c9c7c2;font-weight:600}
.seg button[aria-pressed=true]{background:var(--cu);color:#fff}
.hero{background:#0d0d0f;color:#ecebe8;padding:28px 0 34px;background-image:radial-gradient(ellipse at 85% 0%,#3a2010 0,transparent 60%)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center}
.hero h1{font-size:clamp(30px,5vw,46px)}
.hero .who{color:#ec9259;font-weight:600;margin-bottom:6px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;color:#c9c7c2;font-size:15px}
.meta span{white-space:nowrap}
.chip{display:inline-block;padding:3px 12px;border-radius:999px;background:#2a1a10;color:#ec9259;font-weight:600;font-size:14px;margin-top:14px}
.ring{position:relative;width:190px;height:190px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font:700 46px "Barlow Semi Condensed";line-height:1}
.ring small{color:#a4a29d;font-size:14px}
.tabs{position:sticky;top:62px;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:14px 12px;min-height:48px;font-weight:600;color:var(--mute)}
.tabs button.on{color:var(--ink);border-color:var(--cu)}
main{padding:22px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,26px);margin-bottom:18px}
.card h2{font-size:26px;margin-bottom:4px}
.sub{color:var(--mute);margin:0 0 16px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi small{color:var(--mute);font-size:14px}
.kpi b{display:block;font:700 28px "Barlow Semi Condensed";white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:start;color:var(--mute);font-weight:600;font-size:14px;border-bottom:1px solid var(--line);padding:8px 6px}
td{border-bottom:1px solid var(--line);padding:10px 6px;vertical-align:top}
.n{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
tfoot td{border:0;padding:6px}
tfoot tr.tot td{font-weight:700;font-size:18px;border-top:2px solid var(--ink);padding-top:10px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cu),#ec9259);border-radius:99px}
.mat{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.mat:last-child{border:0}
.dot{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;border:2px solid var(--line);color:transparent}
.dot.y{background:var(--ok);border-color:var(--ok);color:#fff}
.mat div{flex:1}.mat small{display:block;color:var(--mute);font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.filters button,.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px;font-weight:600}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
ol.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 18px 34px}
.tl li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .dot{position:absolute;left:0;top:0}
.tl b{display:block;font-weight:600}.tl small{color:var(--mute);font-size:14px}
.tl.todo .dot{color:var(--mute)}
.upd{border-inline-start:3px solid var(--cu);padding:2px 0 2px 14px;margin-bottom:16px}
.upd small{color:var(--cu2);font-weight:600;font-size:14px}.upd p{margin:2px 0 0}
.contact{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
.contact a{color:var(--cu2);font-weight:600}
footer{text-align:center;color:var(--mute);font-size:14px;padding:20px 0 40px}
footer button{background:none;border:0;color:var(--mute);text-decoration:underline;min-height:44px}
/* contractor */
.ed label{display:block;font-size:14px;color:var(--mute);font-weight:600;margin-bottom:12px}
.ed input,.ed select,.ed textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px;min-height:44px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.row{display:grid;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row input{margin:0}
.r-item{grid-template-columns:minmax(0,1fr) 70px 110px 44px}
.r-mat{grid-template-columns:44px minmax(0,1fr) 70px 90px 100px 44px}
.r-step{grid-template-columns:44px minmax(0,1fr) 150px 44px}
.r-pay{grid-template-columns:150px minmax(0,1fr) 120px 44px}
.r-upd{grid-template-columns:150px minmax(0,1fr) 44px}
.ico{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-weight:700;padding:0}
.ico.x{color:#c0392b}
.chk{width:26px;height:26px;accent-color:var(--cu);margin:auto!important;min-height:0!important}
.add{margin-top:12px;background:var(--soft);border:1px dashed var(--cu);color:var(--cu2);border-radius:10px;padding:10px 16px;min-height:44px;font-weight:700}
.savebar{position:sticky;bottom:0;z-index:15;background:#0d0d0f;color:#ecebe8;border-top:2px solid var(--cu)}
.savebar .wrap{display:flex;align-items:center;gap:12px;min-height:66px;flex-wrap:wrap;padding-block:8px}
.savebar span{margin-inline-end:auto;font-size:15px}
.primary{background:var(--cu);color:#fff;border:0;border-radius:10px;padding:10px 20px;min-height:46px;font-weight:700}
.primary:disabled{opacity:.45;cursor:default}
.ghost{background:none;border:1px solid #3a3a3f;color:#ecebe8;border-radius:10px;padding:10px 16px;min-height:46px;font-weight:600}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;display:flex;gap:12px;align-items:center;max-width:92vw}
.toast button{background:none;border:0;color:#ec9259;font-weight:700;min-height:36px}
.hint{font-size:14px;color:var(--mute);margin:6px 0 0}
.sample{font-size:13px;color:var(--mute);margin-top:6px}
/* splash */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 35%,#24201d 0,#0a0a0b 70%);color:#ecebe8;display:grid;place-items:center;text-align:center;padding:24px;transition:opacity .7s}
#splash.out{opacity:0;pointer-events:none}
#splash .mk{width:min(170px,40vw);height:auto;overflow:visible}
#splash .hex{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.3s .2s cubic-bezier(.6,0,.2,1) forwards}
#splash .ess{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 1s 1s cubic-bezier(.6,0,.2,1) forwards}
#splash .tri{opacity:0;transform-origin:-42px 60px;animation:pop .5s 1.7s forwards}
#splash .wm{width:min(330px,78vw);margin-top:18px;opacity:0;animation:up .8s 1.9s forwards}
#splash .sh{animation:shine 2.4s 2.4s ease-in-out}
#splash h2{font:700 clamp(24px,5vw,38px)/1.15 "Barlow Semi Condensed";margin:26px 0 8px;opacity:0;animation:up .8s 2.8s forwards}
#splash p{font-size:clamp(17px,3vw,22px);color:#ec9259;margin:0;opacity:0;animation:up .8s 3.6s forwards}
#splash .enter{margin-top:28px;opacity:0;animation:up .6s 4.4s forwards}
#splash .skip{position:absolute;top:14px;right:14px;background:none;border:1px solid #3a3a3f;color:#a4a29d;border-radius:999px;padding:8px 16px;min-height:40px}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shine{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
@media(prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}

function contractor(){
 const tabs={dash:cDash,money:cMoney,cobros:cPays,progress:cProg,materials:cMats,estimate:cEst,project:cProj};
 return header(true)+`<nav class="cbar"><div class="wrap">${Object.keys(tabs).map(k=>`<button data-ctab="${k}" class="${ctab===k?'on':''}">${t(k)}</button>`).join('')}</div></nav>
 <main class="ed"><div class="wrap">${tabs[ctab]()}</div></main>
 <div class="savebar"><div class="wrap"><span id="st">${dirty?t('unsaved'):t('saved')}</span><button class="ghost" data-go="v">${t('viewClient')}</button><button class="primary" id="save"${dirty?'':' disabled'}>${t('save')}</button></div></div>`}
function buyForm(){const p=P();return `<div class="card"><h2>${t('logBuy')}</h2><div class="form" style="margin-top:12px">
 <label class="wide">${t('desc')}<input id="xe-desc" type="text"></label><label>${t('amt')}<input id="xe-amt" type="number" step="any" inputmode="decimal"></label><label>${t('date')}<input id="xe-date" type="date" value="${today()}"></label>
 <label>${t('cat')}<select id="xe-cat">${catOpts('Materiales')}</select></label><label>${t('store')}<input id="xe-store" type="text"></label>
 <label class="wide">${t('linkMat')}<select id="xe-mat"><option value="">${t('noLink')}</option>${p.mats.map((m,i)=>m.b?'':`<option value="${i}">${esc(m.n)}</option>`).join('')}</select></label><button class="primary" data-buy>${t('register')}</button></div></div>`}
function payForm(){return `<div class="card"><h2>${t('logPay')}</h2><div class="form" style="margin-top:12px"><label>${t('amt')}<input id="xp-amt" type="number" step="any" inputmode="decimal"></label><label>${t('date')}<input id="xp-date" type="date" value="${today()}"></label><label>${t('note')}<input id="xp-note" type="text"></label><button class="primary" data-pay>${t('register')}</button></div></div>`}
function cDash(){const c=calc(),p=P();const k=(l,v,cls='',e='')=>`<div class="kpi ${cls}"><small>${l}</small><b>${money(v)}</b>${e?`<em>${e}</em>`:''}</div>`;
 return `<h1 style="font-size:clamp(26px,4vw,36px);margin:4px 0 4px">${esc(p.title)}</h1><p class="sub">${esc(p.client)} · ${c.pct}% ${t('done')} · ${t('st_'+p.status)}</p>
 <div class="kpis">${k(t('contract'),c.tot)}${k(t('collected'),c.paid)}${k(t('receivable'),c.bal)}${k(t('budget'),c.bud)}${k(t('spent'),c.spent,'',Math.round(c.bud?c.spent/c.bud*100:0)+'% '+t('of')+' '+t('budget').toLowerCase())}${k(t('left'),c.left,c.left<0?'neg':'')}${k(t('profit'),c.profit,c.profit<0?'neg':'pos',t('profitSub'))}</div>
 <div class="cols">${buyForm()}${payForm()}</div>
 <div class="cols"><div class="card"><h2>${t('byCat')}</h2>${catBars()}</div>
 <div class="card"><h2>${t('recent')}</h2>${I.exps.slice(0,6).map(e=>`<div class="mat"><div><b>${esc(e.desc)}</b><small>${fdate(e.date)} · ${esc(e.store)} · ${esc(e.cat)}</small></div><span class="n">${money(e.amt)}</span></div>`).join('')||`<p class="sub">${t('none')}</p>`}</div></div>`}
function catBars(){const c=calc();return I.budget.map(b=>{const s=c.byCat(b.cat),pc=b.amt?Math.min(100,s/b.amt*100):0,ov=s>b.amt;return `<div class="cat"><div class="top2"><b>${esc(b.cat)}</b><span>${money(s)} ${t('of')} ${money(b.amt)}</span></div><div class="bar"><i class="${ov?'over':''}" style="width:${ov?100:pc}%"></i></div>${ov?`<small style="color:#d0503a;font-weight:600">${t('over')}: ${money(s-b.amt)}</small>`:''}</div>`}).join('')}
function cMoney(){const c=calc();
 return buyForm()+`<div class="card"><h2>${t('budget')}</h2><p class="sub">${money(c.spent)} ${t('of')} ${money(c.bud)} · ${t('left')}: <b>${money(c.left)}</b></p>
 ${I.budget.map((b,i)=>`<div class="row r-bud">${inp(`!budget.${i}.cat`,b.cat,'text','ct')}${inp(`!budget.${i}.amt`,b.amt,'number','am')}<span class="spent">${money(c.byCat(b.cat))}</span>${del('!budget',i)}</div>`).join('')}<button class="add" data-add="!budget">${t('addCat')}</button></div>
 <div class="card"><h2>${t('expLog')}</h2><p class="sub">${I.exps.length} · ${money(c.spent)}</p>
 ${I.exps.map((e,i)=>`<div class="row r-exp">${inp(`!exps.${i}.date`,e.date,'date','dt')}${inp(`!exps.${i}.desc`,e.desc,'text','ds')}<select class="cs" data-k="!exps.${i}.cat" aria-label="${t('cat')}">${catOpts(e.cat)}</select>${inp(`!exps.${i}.store`,e.store,'text','st')}${inp(`!exps.${i}.amt`,e.amt,'number','am')}${del('!exps',i)}</div>`).join('')}</div>`}
function cPays(){const c=calc(),p=P();
 return `<div class="kpis"><div class="kpi"><small>${t('contract')}</small><b>${money(c.tot)}</b></div><div class="kpi"><small>${t('collected')}</small><b>${money(c.paid)}</b></div><div class="kpi"><small>${t('receivable')}</small><b>${money(c.bal)}</b></div></div>`+payForm()+
 `<div class="card"><h2>${t('payments')}</h2>${p.pays.map((x,i)=>`<div class="row r-pay">${inp(`pays.${i}.date`,x.date,'date','dt')}${inp(`pays.${i}.note`,x.note,'text','nt')}${inp(`pays.${i}.amt`,x.amt,'number','am')}${del('pays',i)}</div>`).join('')||`<p class="sub">${t('none')}</p>`}</div>`}
function cProg(){const p=P(),c=calc();
 return `<div class="card"><h2>${t('steps')}</h2><p class="sub">${c.sd} / ${p.steps.length} · ${c.pct}%</p><div class="bar"><i style="width:${c.pct}%"></i></div>${p.steps.map((s,i)=>`<div class="row r-step"><input type="checkbox" class="chk" data-k="steps.${i}.done"${s.done?' checked':''} aria-label="done">${inp(`steps.${i}.t`,s.t,'text','tt')}${inp(`steps.${i}.date`,s.date,'date','d')}${del('steps',i)}</div>`).join('')}<button class="add" data-add="steps">${t('addStep')}</button></div>
 <div class="card"><h2>${t('updates')}</h2><label>${t('newUpd')}<textarea id="nu" rows="3"></textarea></label><button class="primary" data-post>${t('addUpd')}</button><div style="margin-top:18px">${p.upds.map((u,i)=>`<div class="row r-upd">${inp(`upds.${i}.date`,u.date,'date','dt')}${inp(`upds.${i}.text`,u.text,'text','tx')}${del('upds',i)}</div>`).join('')}</div></div>`}
function cMats(){const p=P(),c=calc();
 return `<div class="card"><h2>${t('materials')}</h2><p class="sub">${c.mb} / ${p.mats.length} ${t('purchased').toLowerCase()}. ${t('matPriv')}</p>${p.mats.map((m,i)=>`<div class="row r-mat2"><input type="checkbox" class="chk" data-k="mats.${i}.b"${m.b?' checked':''} aria-label="${t('purchased')}">${inp(`mats.${i}.n`,m.n,'text','nm')}${inp(`mats.${i}.q`,m.q,'number','q')}${inp(`mats.${i}.u`,m.u,'text','u')}${inp(`mats.${i}.d`,m.d,'date','dt')}${del('mats',i)}</div>`).join('')}<button class="add" data-add="mats">${t('addMat')}</button><p class="hint">✓ = ${t('purchased')} · ${t('qty')} · ${t('unit')} · ${t('datePaid')}</p></div>`}
function cEst(){const p=P(),c=calc();
 return `<div class="card"><h2>${t('estimate')}</h2><p class="sub">${t('materials')}: <b>${money(c.subM)}</b> · ${t('labor')}: <b>${money(c.subL)}</b> · ${t('taxMat')}: <b>${money(c.tax)}</b> · ${t('total')}: <b>${money(c.tot)}</b></p>${p.items.map((x,i)=>`<div class="row r-item">${inp(`items.${i}.d`,x.d,'text','dd')}<select class="tp" data-k="items.${i}.k" aria-label="type"><option value="mat"${x.k!=='lab'?' selected':''}>${t('materials')}</option><option value="lab"${x.k==='lab'?' selected':''}>${t('labor')}</option></select>${inp(`items.${i}.q`,x.q,'number','q')}${inp(`items.${i}.p`,x.p,'number','p')}${del('items',i)}</div>`).join('')}<button class="add" data-add="items">${t('addItem')}</button><label style="max-width:200px;margin-top:14px">${t('taxp')}${inp('tax',p.tax,'number')}</label></div>`}
function cProj(){const p=P();
 return `<div class="card"><h2>${t('projInfo')}</h2><p class="sample">${t('sample')}</p><div class="grid2" style="margin-top:12px">
 <label>${t('clientName')}${inp('client',p.client)}</label><label>${t('ptitle')}${inp('title',p.title)}</label>
 <label>${t('address')}${inp('address',p.address)}</label><label>${t('status')}<select data-k="status">${['planning','progress','paused','done'].map(s=>`<option value="${s}"${p.status===s?' selected':''}>${t('st_'+s)}</option>`).join('')}</select></label>
 <label>${t('start')}${inp('start',p.start,'date')}</label><label>${t('end')}${inp('end',p.end,'date')}</label></div></div>
 <div class="card"><h2>${t('contactInfo')}</h2><div class="grid2"><label>${t('cname')}${inp('@name',S.contact.name)}</label><label>${t('phone')}${inp('@phone',S.contact.phone,'tel')}</label><label>${t('email')}${inp('@email',S.contact.email,'email')}</label></div><p class="hint">${t('share')}</p></div>
 <div class="card"><h2>${t('changePin')}</h2><div class="form" style="margin-top:12px"><label>${t('newPin')}<input id="np" type="password" inputmode="numeric" autocomplete="off"></label><button class="primary" data-newpin>${t('changePin')}</button></div></div>`}

function render(){document.documentElement.lang=L;const y=scrollY;app.innerHTML=role==='c'?(I?contractor():lock()):client();document.title=role==='c'?'Sonec · '+t('contractor'):'Sonec · '+(L==='es'?'Mi Proyecto':'My Project');scrollTo(0,y)}
function obj(k){if(k[0]==='!')return[I,k.slice(1)];return[P(),k]}
function setK(k,v){if(k[0]==='@'){S.contact[k.slice(1)]=v;return}let[o,path]=obj(k);const ps=path.split('.');while(ps.length>1)o=o[ps.shift()];o[ps[0]]=v}
function arr(a){const[o,k]=obj(a);return o[k]}
function mark(){dirty=true;const st=$('#st'),b=$('#save');if(st)st.textContent=t('unsaved');if(b)b.disabled=false}
function toast(msg,undo){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.innerHTML=`<span>${msg}</span>${undo?`<button>${t('undo')}</button>`:''}`;document.body.appendChild(d);
 if(undo)d.querySelector('button').onclick=()=>{S=undoSnap.S;I=undoSnap.I;d.remove();mark();render()};clearTimeout(tmr);tmr=setTimeout(()=>d.remove(),5000)}
const snap=()=>{undoSnap={S:structuredClone(S),I:structuredClone(I)}};
const blank={items:{d:'',k:'mat',q:1,p:0},mats:{n:'',q:1,u:'',b:false,d:''},steps:{t:'',done:false,date:''},'!budget':{cat:'',amt:0}};

app.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;let v=e.target.type==='checkbox'?e.target.checked:e.target.value;if(e.target.type==='number')v=v===''?0:+v;setK(k,v);
 if(/^mats\.\d+\.b$/.test(k)&&v){const m=P().mats[+k.split('.')[1]];if(!m.d)m.d=today()}
 mark();if(e.target.type==='checkbox'||e.target.tagName==='SELECT')render()});
app.addEventListener('change',e=>{if(/^!budget\.\d+\.(cat|amt)$/.test(e.target.dataset.k||''))render()});
app.addEventListener('submit',async e=>{e.preventDefault();if(e.target.id!=='lockf')return;const a=$('#pin1').value.trim(),b=$('#pin2')?.value.trim();
 if(S.vault){try{I=await open_(S.vault,a);PIN=a;lockErr='';ctab='dash';render()}catch(_){lockErr=t('badPin');render();$('#pin1').focus()}}
 else{if(a.length<4){lockErr=t('pinShort')}else if(a!==b){lockErr=t('pinMatch')}else{PIN=a;I=S.seed||{budget:[{cat:'Materiales',amt:0},{cat:'Mano de obra',amt:0}],exps:[],notes:''};lockErr='';mark()}render();if(dirty)mark()}});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||(b.type==='submit'&&b.form))return;const d=b.dataset;const num=id=>+($(id).value||0);
 if(d.lang){L=d.lang;S.lang=L;render()}
 else if(d.tab){tab=d.tab;render();$('.tabs').scrollIntoView({block:'start'})}
 else if(d.ctab){ctab=d.ctab;render();scrollTo(0,0)}
 else if(d.mf){mf=d.mf;render()}
 else if(d.go){role=d.go;try{history.replaceState(null,'',role==='c'?'#contractor':location.pathname+location.search)}catch(_){}render();scrollTo(0,0)}
 else if('lock' in d){I=null;PIN=null;render()}
 else if(d.add){arr(d.add).push({...blank[d.add]});mark();render()}
 else if(d.del){snap();const k=d.del.lastIndexOf('.');arr(d.del.slice(0,k)).splice(+d.del.slice(k+1),1);mark();render();toast(t('removed'),true)}
 else if('post' in d){const v=$('#nu').value.trim();if(!v)return;P().upds.unshift({date:today(),text:v});mark();render()}
 else if('buy' in d){const desc=$('#xe-desc').value.trim(),amt=num('#xe-amt');if(!desc&&!amt){$('#xe-desc').focus();return}snap();
  const mi=$('#xe-mat').value,date=$('#xe-date').value||today();I.exps.unshift({date,desc:desc||P().mats[mi]?.n||'',cat:$('#xe-cat').value,store:$('#xe-store').value.trim(),amt});
  if(mi!==''){const m=P().mats[+mi];m.b=true;m.d=date}I.exps.sort((a,b)=>b.date.localeCompare(a.date));mark();render();toast(t('buyOk'),true)}
 else if('pay' in d){const amt=num('#xp-amt');if(!amt){$('#xp-amt').focus();return}snap();P().pays.push({date:$('#xp-date').value||today(),note:$('#xp-note').value.trim(),amt});P().pays.sort((a,b)=>a.date.localeCompare(b.date));mark();render();toast(t('payOk'),true)}
 else if('newpin' in d){const v=$('#np').value.trim();if(v.length<4){toast(t('pinShort'));return}PIN=v;mark();toast(t('pinChanged'))}
 else if(b.id==='save')save();
});
addEventListener('hashchange',()=>{role=location.hash==='#contractor'?'c':'v';render()});
addEventListener('beforeunload',e=>{if(dirty&&I)e.preventDefault()});

function buildDoc(){const json=JSON.stringify(S).replace(/</g,'\\u003c');
 return '<!DOCTYPE html>\n<html lang="'+L+'">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Sonec · Mi Proyecto</title>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&family=Montserrat:wght@600;700&display=swap">\n<style id="css">'+SRC_CSS+'</style>\n</head>\n<body>\n<script id="data" type="application/json">'+json+'<\/script>\n<div id="app"></div>\n<script id="js">'+SRC_JS+'<\/script>\n</body>\n</html>\n'}
let art=null;
async function save(){const b=$('#save'),st=$('#st');b.disabled=true;st.textContent=t('saving');
 try{if(I&&PIN){S.vault=await seal(I,PIN);delete S.seed}}catch(err){st.textContent=String(err);b.disabled=false;return}
 if(art){try{dirty=false;try{sessionStorage.setItem('sonec-role',role)}catch(_){}await art.publish(buildDoc());st.textContent=t('saved')}catch(err){dirty=true;b.disabled=false;const c=String(err&&(err.code||err.message||err));st.textContent=/not_granted|not_writer/.test(c)?t('noPerm'):t('unsaved')+(/conflict/.test(c)?'':' ('+c+')')}}
 else{try{localStorage.setItem('sonec-state',JSON.stringify(S))}catch(_){}dirty=false;try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buildDoc()],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove();st.textContent=t('gh')}catch(_){st.textContent=t('local')}}}
try{if(sessionStorage.getItem('sonec-role')==='c'){role='c';sessionStorage.removeItem('sonec-role')}}catch(_){}
render();
if(role!=='c')splash();
(window.claude?.use?window.claude.use('artifact'):Promise.resolve(null)).then(a=>{art=a;if(!a){try{const s=localStorage.getItem('sonec-state');if(s){S=JSON.parse(s);if(!I)render()}}catch(_){}}}).catch(()=>{});
}
</script>
</body>
</html>
